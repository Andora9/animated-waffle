name: Deploy Supabase Functions

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: bpvfbzkefyqocmqdggtb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Set Razorpay secrets
        run: |
          supabase secrets set \
            RAZORPAY_KEY_ID="${{ secrets.RAZORPAY_KEY_ID }}" \
            RAZORPAY_KEY_SECRET="${{ secrets.RAZORPAY_KEY_SECRET }}" \
            RAZORPAY_WEBHOOK_SECRET="${{ secrets.RAZORPAY_WEBHOOK_SECRET }}" \
            --project-ref "$PROJECT_REF" \
            --yes

      - name: Deploy all functions
        run: |
          supabase functions deploy razorpay-checkout --project-ref "$PROJECT_REF" --yes
          supabase functions deploy razorpay-webhook --project-ref "$PROJECT_REF" --no-verify-jwt --yes
          supabase functions deploy admin-access-control --project-ref "$PROJECT_REF" --yes
          supabase functions deploy refund-admin-action --project-ref "$PROJECT_REF" --yes
          supabase functions deploy return-request --project-ref "$PROJECT_REF" --yes
